<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="以上海浦东国际机场为起点的大闸蟹出口流向平面地图">
  <title>大闸蟹出口流向图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/crab-export-routes/style.css">
  <script src="./assets/brand-map/echarts.min.js"></script>
</head>
<body>
  <main class="export-shell">
    <header class="page-header">
      <h1>大闸蟹出口流向图</h1>
      <p>以上海浦东国际机场为起点的全球出口线路</p>
    </header>

    <section class="map-stage" aria-label="以上海浦东国际机场为起点的大闸蟹出口动态平面地图">
      <div id="chart" role="img" aria-label="上海浦东国际机场至九个国家和地区的大闸蟹出口动态航线"></div>
      <div id="loading" class="loading">正在加载世界地图...</div>

      <aside class="destination-panel" aria-label="出口目的地数据">
        <div class="panel-heading">
          <span>出口目的地</span>
          <span>出口量 / 吨</span>
        </div>
        <div id="destination-list" class="destination-list"></div>
      </aside>

      <div class="origin-label">
        <span></span>
        上海浦东国际机场
      </div>
    </section>

  <script src="./assets/crab-export-routes/chart.js"></script>
