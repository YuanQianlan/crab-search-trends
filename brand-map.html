<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="中国六大代表性大闸蟹品牌产地分布动态地图">
  <title>中国大闸蟹品牌分布图</title>
  <link rel="stylesheet" href="./assets/brand-map/brand-map.css">
  <script src="./assets/brand-map/echarts.min.js"></script>
</head>
<body>
  <main class="brand-map-shell">
    <header class="brand-map-header">
      <div>
        <p class="eyebrow">CHINESE MITTEN CRAB · ORIGIN ATLAS</p>
        <h1>中国大闸蟹品牌分布图</h1>
        <p class="subtitle">六个代表性产区 · 地理坐标定位 · 动态涟漪标记</p>
      </div>
      <div class="header-badge">
        <span>6</span>
        <small>核心品牌产区</small>
      </div>
    </header>

    <section class="map-stage">
      <div id="brandMap" role="img" aria-label="中国六大代表性大闸蟹品牌产地动态地图"></div>
      <aside class="brand-panel" aria-label="品牌产地列表">
        <div class="panel-title">品牌产地</div>
        <div id="brandList" class="brand-list"></div>
        <p class="panel-note">拖动地图平移，滚轮缩放；悬停标记查看产地信息。</p>
      </aside>
      <div class="map-caption">
        <span class="caption-pulse"></span>
        标记代表品牌核心产地，并非销售门店位置
      </div>
    </section>
  </main>

  <script src="./assets/brand-map/china-provinces.js"></script>
  <script src="./assets/brand-map/brand-map.js"></script>
</body>
</html>
