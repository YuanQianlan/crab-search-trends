<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025年1~11月河蟹线上销售量与销售额桑基图</title>
  <script src="./assets/brand-map/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #FAF2E6;
      color: #3b4546;
      font-family: "Times New Roman", "SimSun", "宋体", serif;
    }
    .shell {
      position: relative;
      width: 100vw;
      height: max(1040px, 100vh);
      min-width: 0;
      min-height: 1040px;
    }
    .page-title {
      position: absolute;
      z-index: 4;
      top: 94px;
      left: 44%;
      margin: 0;
      color: #334041;
      font-size: 32px;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .charts {
      position: absolute;
      top: 220px;
      right: 18px;
      bottom: 28px;
      left: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    .chart-panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #d8d2c8;
      border-radius: 11px;
      background: rgba(250,248,242,.62);
    }
    .chart { width: 100%; height: 100%; }
    .node-labels {
      position: absolute;
      z-index: 5;
      top: 0;
      bottom: 0;
      width: 64px;
      pointer-events: none;
    }
    .node-labels--left { left: 4px; text-align: right; }
    .node-labels--right { right: 4px; text-align: left; }
    .node-label {
      position: absolute;
      right: 0;
      left: 0;
      color: #3f4a4b;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
      transform: translateY(-50%);
      white-space: nowrap;
    }
    .market-share-panel {
      position: absolute;
      z-index: 6;
      top: 56px;
      left: calc(50% + 285px);
      display: block;
      width: 220px;
      padding: 11px 16px 12px;
      border: 1px solid #d2cbc0;
      border-radius: 9px;
      background: rgba(250,248,242,.94);
      box-shadow: 0 7px 19px rgba(70,78,76,.08);
    }
    .market-share-title {
      margin-bottom: 5px;
      padding-bottom: 7px;
      border-bottom: 1px solid #e3ddd2;
      color: #3f4a4b;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }
    .market-share-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 3px;
      font-size: 15px;
      white-space: nowrap;
    }
    .market-share-name { display: inline-flex; align-items: center; gap: 6px; }
    .market-share-dot { width: 7px; height: 7px; border-radius: 50%; }
    .market-share-value { font: 700 18px "Times New Roman", serif; }
    .linked-popup-panel {
      position: absolute;
      z-index: 6;
      top: 52%;
      right: 24px;
      left: auto;
      width: 172px;
      min-height: 226px;
      padding: 15px 14px 16px;
      border: 1px solid #d2cbc0;
      border-radius: 10px;
      background: rgba(250,248,242,.96);
      box-shadow: 0 9px 24px rgba(70,78,76,.11);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(-7px);
      transition: opacity .16s ease, transform .16s ease;
    }
    .linked-popup-panel.is-visible {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    .popup-heading {
      margin-bottom: 14px;
      padding-bottom: 11px;
      border-bottom: 1px solid #e3ddd2;
    }
    .popup-title { color: #3f4a4b; font-size: 16px; font-weight: 700; }
    .popup-relation {
      display: block;
      margin-top: 6px;
      color: #74756f;
      font-size: 13px;
      line-height: 1.45;
    }
    .popup-values {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .popup-metric {
      padding: 9px 10px;
      border-radius: 7px;
      background: #f6f1e9;
    }
    .popup-label { color: #7b7b73; font-size: 12px; }
    .popup-value {
      margin-top: 4px;
      color: #3b4546;
      font: 700 20px "Times New Roman", serif;
    }
    .popup-value.is-volume { color: #6f8fa3; }
    .popup-value.is-sales { color: #bd8f84; }
    @media (max-width: 900px) {
      .page-title {
        top: 170px;
        left: 50%;
        font-size: 24px;
      }
      .market-share-panel {
        top: 44px;
        left: 50%;
        transform: translateX(-50%);
      }
      .charts { top: 238px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1 class="page-title">2025年1~11月河蟹线上销售量与销售额桑基图</h1>
    <section class="charts">
      <article class="chart-panel">
        <div id="volume-chart" class="chart" role="img" aria-label="各平台价格带销量结构桑基图"></div>
        <div id="volume-left-labels" class="node-labels node-labels--left"></div>
        <div id="volume-right-labels" class="node-labels node-labels--right"></div>
      </article>
      <article class="chart-panel">
        <div id="sales-chart" class="chart" role="img" aria-label="各平台价格带销售额结构桑基图"></div>
        <div id="sales-left-labels" class="node-labels node-labels--left"></div>
        <div id="sales-right-labels" class="node-labels node-labels--right"></div>
      </article>
    </section>
    <aside class="market-share-panel">
      <div class="market-share-title">平台销售额市场份额</div>
      <div class="market-share-row"><span class="market-share-name"><i class="market-share-dot" style="background:#6f8fa3"></i>京东</span><span class="market-share-value">55%</span></div>
      <div class="market-share-row"><span class="market-share-name"><i class="market-share-dot" style="background:#bd8f84"></i>天猫</span><span class="market-share-value">38%</span></div>
      <div class="market-share-row"><span class="market-share-name"><i class="market-share-dot" style="background:#7f9b8d"></i>抖音</span><span class="market-share-value">7%</span></div>
    </aside>
    <section class="linked-popup-panel" id="linked-popup" aria-live="polite">
      <div class="popup-heading">
        <span class="popup-title">关联数据</span>
        <span class="popup-relation"></span>
      </div>
      <div class="popup-values"></div>
    </section>
  </main>
  <script>
    (function () {
      "use strict";

      const platformShares = { "京东":55, "天猫":38, "抖音":7 };
      const platformColors = { "京东":"#6f8fa3", "天猫":"#bd8f84", "抖音":"#7f9b8d" };
      const bands = ["<258元","258-447元","447-880元",">880元"];
      const bandColors = ["#d8c18f","#c9a58b","#a98f9c","#8f889f"];
      const paired = [
        { platform:"京东", band:"<258元", volume:79.2, sales:55.7 },
        { platform:"京东", band:"258-447元", volume:15.7, sales:26.6 },
        { platform:"京东", band:"447-880元", volume:4.4, sales:13.1 },
        { platform:"京东", band:">880元", volume:0.7, sales:4.6 },
        { platform:"天猫", band:"<258元", volume:52.8, sales:25.0 },
        { platform:"天猫", band:"258-447元", volume:30.6, sales:32.7 },
        { platform:"天猫", band:"447-880元", volume:11.3, sales:22.5 },
        { platform:"天猫", band:">880元", volume:5.4, sales:19.8 },
        { platform:"抖音", band:"<258元", volume:53.1, sales:38.7 },
        { platform:"抖音", band:"258-447元", volume:44.2, sales:54.5 },
        { platform:"抖音", band:"447-880元", volume:2.6, sales:6.0 },
        { platform:"抖音", band:">880元", volume:0.1, sales:0.9 }
      ];

      const volumeChart = echarts.init(document.getElementById("volume-chart"), null, { renderer:"canvas" });
      const salesChart = echarts.init(document.getElementById("sales-chart"), null, { renderer:"canvas" });
      const popupContainer = document.getElementById("linked-popup");

      function visualValues(metric) {
        const result=new Array(paired.length);
        Object.keys(platformShares).forEach(function (platform) {
          const indexes=[];
          paired.forEach(function (item,index) {
            if (item.platform === platform) indexes.push(index);
          });
          const raised=indexes.map(function (index) {
            return Math.max(paired[index][metric],2);
          });
          const scale=100/raised.reduce(function (sum,value) { return sum+value; },0);
          indexes.forEach(function (index,position) {
            result[index]=raised[position]*scale;
          });
        });
        return result;
      }

      const visualMetricValues={
        volume:visualValues("volume"),
        sales:visualValues("sales")
      };

      function nodes(metric) {
        return Object.keys(platformShares).map(function (platform) {
          return {
            name:platform,
            kind:"platform",
            marketShare:platformShares[platform],
            itemStyle:{ color:platformColors[platform] },
            label:{ show:false }
          };
        }).concat(bands.map(function (band,index) {
          return {
            name:band,
            kind:"band",
            itemStyle:{ color:bandColors[index] },
            label:{ show:false }
          };
        }));
      }

      function links(metric, activeIndex) {
        return paired.map(function (item,index) {
          return {
            source:item.platform,
            target:item.band,
            value:visualMetricValues[metric][index],
            pairIndex:index,
            volume:item.volume,
            sales:item.sales,
            ratio:item.sales / item.volume,
            lineStyle:{
              color:bandColors[bands.indexOf(item.band)],
              opacity:activeIndex == null ? .46 : (index === activeIndex ? .82 : .07)
            }
          };
        });
      }

      function tooltipFormatter(metric) {
        return function (params) {
          if (params.dataType !== "edge") {
            if (params.data.kind === "platform") {
              return "<b>" + params.name + "</b><br>销售额市场份额：<b>" + params.data.marketShare.toFixed(0) + "%</b>";
            }
            return "<b>" + params.name + "</b>";
          }
          const d=params.data;
          const main=metric === "volume" ? d.volume : d.sales;
          const companion=metric === "volume" ? d.sales : d.volume;
          return "<b>" + d.source + " → " + d.target + "</b><br>" +
            (metric === "volume" ? "销量占比" : "销售额占比") + "：<b>" + main.toFixed(1) + "%</b><br>" +
            (metric === "volume" ? "对应销售额" : "对应销量") + "：<b>" + companion.toFixed(1) + "%</b>";
        };
      }

      function chartOption(metric) {
        const isVolume=metric === "volume";
        return {
          backgroundColor:"transparent",
          animationDuration:700,
          animationDurationUpdate:450,
          textStyle:{ fontFamily:'"Times New Roman","SimSun","宋体",serif' },
          title:{
            text:isVolume ? "销量结构" : "销售额结构",
            left:"center",
            top:18,
            textStyle:{ fontSize:20, fontWeight:"bold", color:isVolume ? "#6f8fa3" : "#bd8f84" }
          },
          tooltip:{
            trigger:"item",
            triggerOn:"mousemove|click",
            showContent:false,
            confine:true,
            backgroundColor:"rgba(250,248,242,.98)",
            borderColor:isVolume ? "#a9bdc7" : "#d2b5ad",
            borderWidth:1,
            padding:[9,11],
            textStyle:{ color:"#3b4546", fontSize:13 },
            extraCssText:"box-shadow:0 5px 17px rgba(70,78,76,.15);border-radius:7px;",
            formatter:tooltipFormatter(metric)
          },
          series:[{
            id:isVolume ? "volumeSankey" : "salesSankey",
            type:"sankey",
            left:76,
            right:76,
            top:100,
            bottom:44,
            nodeWidth:22,
            nodeGap:25,
            nodeAlign:"justify",
            layoutIterations:0,
            draggable:true,
            data:nodes(metric),
            links:links(metric,null),
            emphasis:{ focus:"none" },
            itemStyle:{ borderColor:"#f7f2ea", borderWidth:2 },
            lineStyle:{ curveness:.5 },
            label:{ show:false }
          }]
        };
      }

      function nodeCenters(values,height) {
        const top=100;
        const bottom=44;
        const gap=25;
        const usable=height-top-bottom-gap*(values.length-1);
        const total=values.reduce(function (sum,value) { return sum+value; },0);
        const scale=usable/total;
        let cursor=top;
        return values.map(function (value) {
          const center=cursor+value*scale/2;
          cursor+=value*scale+gap;
          return center;
        });
      }

      function renderExternalLabels(metric) {
        const height=document.getElementById(metric+"-chart").clientHeight;
        const platformTotals=Object.keys(platformShares).map(function (platform) {
          return paired.reduce(function (sum,item,index) {
            return sum+(item.platform === platform ? visualMetricValues[metric][index] : 0);
          },0);
        });
        const bandTotals=bands.map(function (band) {
          return paired.reduce(function (sum,item,index) {
            return sum+(item.band === band ? visualMetricValues[metric][index] : 0);
          },0);
        });
        const platformCenters=nodeCenters(platformTotals,height);
        const bandCenters=nodeCenters(bandTotals,height);
        document.getElementById(metric+"-left-labels").innerHTML=
          Object.keys(platformShares).map(function (platform,index) {
            return '<span class="node-label" style="top:'+platformCenters[index]+'px">'+platform+'</span>';
          }).join("");
        document.getElementById(metric+"-right-labels").innerHTML=
          bands.map(function (band,index) {
            return '<span class="node-label" style="top:'+bandCenters[index]+'px">'+band+'</span>';
          }).join("");
      }

      function showLinkedPair(index) {
        const item=paired[index];
        document.querySelector(".popup-relation").textContent=item.platform + " → " + item.band;
        document.querySelector(".popup-values").innerHTML=
          '<div class="popup-metric"><div class="popup-label">销量占比</div><div class="popup-value is-volume">' + item.volume.toFixed(1) + '%</div></div>' +
          '<div class="popup-metric"><div class="popup-label">销售额占比</div><div class="popup-value is-sales">' + item.sales.toFixed(1) + '%</div></div>';
        popupContainer.classList.add("is-visible");
        volumeChart.setOption({ series:[{ id:"volumeSankey", links:links("volume",index) }] });
        salesChart.setOption({ series:[{ id:"salesSankey", links:links("sales",index) }] });
      }

      function hideLinkedPair() {
        popupContainer.classList.remove("is-visible");
        volumeChart.setOption({ series:[{ id:"volumeSankey", links:links("volume",null) }] });
        salesChart.setOption({ series:[{ id:"salesSankey", links:links("sales",null) }] });
      }

      function bind(sourceChart) {
        sourceChart.on("mouseover", function (params) {
          if (params.dataType === "edge") showLinkedPair(params.data.pairIndex);
        });
        sourceChart.getZr().on("globalout", hideLinkedPair);
      }

      volumeChart.setOption(chartOption("volume"));
      salesChart.setOption(chartOption("sales"));
      renderExternalLabels("volume");
      renderExternalLabels("sales");
      bind(volumeChart);
      bind(salesChart);
      window.__showLinkedPair=showLinkedPair;
      window.addEventListener("resize", function () {
        volumeChart.resize();
        salesChart.resize();
        renderExternalLabels("volume");
        renderExternalLabels("sales");
      });
    })();
  </script>
</body>
</html>
