<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="主要生产省份与消费省份弦图">
  <title>主要生产省份与消费省份弦图</title>
  <link rel="stylesheet" href="./assets/chart5-chord/chart5.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
</head>
<body>
  <main class="chart-page">
    <h1>主要生产省份与消费省份弦图</h1>
    <section class="chart-stage">
      <div class="side-label production-label">生产端</div>
      <div id="chordChart" role="img" aria-label="主要生产省份与消费省份弦图"></div>
      <div class="side-label sales-label">消费端</div>
      <div class="bottom-label">生产与消费</div>
      <div class="legend" aria-label="省份角色图例">
        <span><i class="production"></i>仅生产</span>
        <span><i class="sales"></i>仅消费</span>
        <span><i class="both"></i>生产与消费</span>
      </div>
    </section>
  </main>
  <script src="./assets/chart5-chord/chart5.js"></script>
</body>
</html>
