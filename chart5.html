<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="生产省份与销售省份联系和弦图">
  <title>生产省份与销售省份联系</title>
  <link rel="stylesheet" href="./assets/chart5-chord/chart5.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
</head>
<body>
  <main class="chart-page">
    <h1>生产省份与销售省份联系</h1>
    <div class="legend" aria-label="省份角色图例">
      <span><i class="production"></i>仅生产</span>
      <span><i class="sales"></i>仅销售</span>
      <span><i class="both"></i>生产与销售</span>
    </div>
    <section class="chart-stage">
      <div class="side-label production-label">生产端</div>
      <div id="chordChart" role="img" aria-label="生产省份与销售省份联系和弦图"></div>
      <div class="side-label sales-label">销售端</div>
      <div class="bottom-label">生产与销售</div>
    </section>
  </main>
  <script src="./assets/chart5-chord/chart5.js"></script>
</body>
</html>
